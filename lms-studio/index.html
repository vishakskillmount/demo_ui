<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Skillmount Learn study workspace, a static design demo." />
    <link rel="icon" type="image/png" href="./logo-icon.png" />
    <title>Skillmount Learn</title>
    <script>
      // Apply the saved theme before first paint so dark mode never flashes light.
      try { var t = localStorage.getItem("theme"); if (t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches)) document.documentElement.classList.add("dark"); } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
